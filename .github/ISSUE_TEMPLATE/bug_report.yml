name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    attributes: { label: What happened?, description: "What you said, what you expected, what it did." }
    validations: { required: true }
  - type: textarea
    attributes: { label: Log, description: "Relevant lines from ~/.macbutler/logs/butler.log (remove anything private).", render: text }
  - type: input
    attributes: { label: macOS version and Mac model, placeholder: "macOS 15.3, MacBook Air M2" }
    validations: { required: true }
  - type: dropdown
    attributes: { label: Language, options: [Korean, English, Other] }
  - type: textarea
    attributes: { label: Menu → Status, description: "Which items show ✓ / ✗?" }
