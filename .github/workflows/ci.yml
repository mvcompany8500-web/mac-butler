name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: ./build.sh
      - name: Self-test (command grammar)
        run: MACBUTLER_HOME=$RUNNER_TEMP/mb build/Sasarisa.app/Contents/MacOS/Sasarisa --selftest
